        - generic [ref=f3e67]:
          - heading "1. Who we are" [level=2] [ref=f3e68]
          - paragraph [ref=f3e69]: Valentisys provides outsourcing, customer support, digital marketing, application, web, and AI services.
          - paragraph [ref=f3e70]:
            - text: We are the data controller for the personal information described in this policy. For anything relating to your data, write to
            - link "sales@valentisys.com" [ref=f3e71] [cursor=pointer]:
              - /url: mailto:sales@valentisys.com
            - text: .
          - paragraph [ref=f3e72]: Where we deliver services on behalf of a client, we usually act as a data processor under that client's instructions. Those arrangements are governed by the signed agreement and data processing terms for that engagement, not by this policy.
        - generic [ref=f3e73]:
          - heading "2. What we collect" [level=2] [ref=f3e74]
          - paragraph [ref=f3e75]: We only collect information you choose to give us, plus the technical records any website generates.
          - heading "Inquiries" [level=3] [ref=f3e76]
          - paragraph [ref=f3e77]:
            - text: When you submit the form on our
            - link "contact page" [ref=f3e78] [cursor=pointer]:
              - /url: /contact
            - text: we collect your name, work email address, contact number, the industry and service you selected, your company name if you supply one, and whatever you write in the message field.
          - heading "Job applications" [level=3] [ref=f3e79]
          - paragraph [ref=f3e80]:
            - text: When you apply through our
            - link "careers page" [ref=f3e81] [cursor=pointer]:
              - /url: /careers
            - text: we collect your name, email address, contact number, the team you applied to, and the resume file you attach. Your resume may contain further personal information; we only use what is relevant to assessing your application.
          - heading "Technical records" [level=3] [ref=f3e82]
          - paragraph [ref=f3e83]: "Our host records standard server logs for every request: IP address, browser and device type, the page requested, and the time. These are generated automatically and used to keep the site available and secure."
          - heading "What we do not collect" [level=3] [ref=f3e84]
          - paragraph [ref=f3e85]: We do not ask for special category data, financial details, or government identification through this website, and we do not buy contact lists.
        - generic [ref=f3e86]:
          - heading "3. Why we use it, and on what basis" [level=2] [ref=f3e87]
          - list [ref=f3e88]:
            - listitem [ref=f3e89]:
              - strong [ref=f3e90]: To answer your inquiry and quote for work.
              - text: Our lawful basis is the steps taken at your request before entering a contract, and our legitimate interest in responding to people who approach us.
            - listitem [ref=f3e91]:
              - strong [ref=f3e92]: To assess your job application.
              - text: Our lawful basis is the steps taken at your request before entering an employment contract, and our legitimate interest in recruiting.
            - listitem [ref=f3e93]:
              - strong [ref=f3e94]: To keep the site available and secure.
              - text: Our lawful basis is our legitimate interest in preventing abuse and diagnosing faults.
            - listitem [ref=f3e95]:
              - strong [ref=f3e96]: To set optional cookies.
              - text: Our lawful basis is your consent, which you can give, refuse, or withdraw at any time from our
              - link "cookie preferences" [ref=f3e97] [cursor=pointer]:
                - /url: /cookies#preferences
              - text: .
          - paragraph [ref=f3e98]: We do not use your information for automated decision-making, and we do not profile you.
        - generic [ref=f3e99]:
          - heading "4. Cookies and local storage" [level=2] [ref=f3e100]
          - paragraph [ref=f3e101]:
            - text: This site sets no advertising or tracking cookies by default. What we do store, and how to change it, is set out in full in our
            - link "cookie policy" [ref=f3e102] [cursor=pointer]:
              - /url: /cookies
            - text: ", which also contains the preference controls."
        - generic [ref=f3e103]:
          - heading "5. Who we share it with" [level=2] [ref=f3e104]
          - paragraph [ref=f3e105]: "We never sell your personal information, and we do not share it for anyone else's marketing. We share it only with the service providers we need in order to run the site, each of which is bound by contract to process it on our instructions alone:"
          - list [ref=f3e106]:
            - listitem [ref=f3e107]:
              - strong [ref=f3e108]: Netlify
              - text: "— Website hosting and form delivery. Data processed in: United States / global CDN."
          - paragraph [ref=f3e109]: We may also disclose information where the law requires it, or to establish or defend a legal claim.
        - generic [ref=f3e110]:
          - heading "6. International transfers" [level=2] [ref=f3e111]
          - paragraph [ref=f3e112]: We operate from Pakistan, and our hosting provider stores data on infrastructure outside it. Where personal data leaves the UK or the European Economic Area, the transfer is covered by the provider's standard contractual clauses or an equivalent safeguard. You can ask us for details of the safeguard that applies to you.
        - generic [ref=f3e113]:
          - heading "7. How long we keep it" [level=2] [ref=f3e114]
          - list [ref=f3e115]:
            - listitem [ref=f3e116]:
              - strong [ref=f3e117]: "Inquiries that do not become work:"
              - text: up to 24 months, so we can pick up a conversation you return to, then deleted.
            - listitem [ref=f3e118]:
              - strong [ref=f3e119]: "Inquiries that become work:"
              - text: kept for the life of the engagement and for as long afterward as tax and contract law requires.
            - listitem [ref=f3e120]:
              - strong [ref=f3e121]: "Unsuccessful applications:"
              - text: up to 12 months, so we can approach you about a later opening. Tell us and we will delete your resume sooner.
            - listitem [ref=f3e122]:
              - strong [ref=f3e123]: "Server logs:"
              - text: retained by our host on its own rolling schedule, typically under 30 days.
        - generic [ref=f3e124]:
          - heading "8. How we protect it" [level=2] [ref=f3e125]
          - paragraph [ref=f3e126]: The site is served only over HTTPS. Form submissions are encrypted in transit, and access to them is limited to the people who need it to reply to you. Our staff work under signed confidentiality terms and are given the least access their role requires. No system is perfectly secure, but if a breach affects your rights we will notify you and the relevant regulator as the law requires.
        - generic [ref=f3e127]:
          - heading "9. Your rights" [level=2] [ref=f3e128]
          - paragraph [ref=f3e129]: "Depending on where you live, you may have the right to ask us to: give you a copy of the data we hold about you; correct it if it is wrong; delete it; restrict or object to how we use it; send it to another provider in a portable format; or withdraw consent you previously gave."
          - paragraph [ref=f3e130]:
            - text: Email
            - link "sales@valentisys.com" [ref=f3e131] [cursor=pointer]:
              - /url: mailto:sales@valentisys.com
            - text: and we will respond within 30 days. Exercising these rights is free, and we will not treat you differently for it. If you are unhappy with our answer you may complain to your national data protection authority.
        - generic [ref=f3e132]:
          - heading "10. Children" [level=2] [ref=f3e133]
          - paragraph [ref=f3e134]: This site is aimed at businesses and job seekers, not children. We do not knowingly collect information from anyone under 16. If you believe a child has sent us personal information, contact us and we will delete it.
        - generic [ref=f3e135]:
          - heading "11. Changes to this policy" [level=2] [ref=f3e136]
          - paragraph [ref=f3e137]: We update this policy when what we do with your data changes. The date at the top of this page always reflects the current version. Material changes will be highlighted on the site before they take effect.
        - generic [ref=f3e138]:
          - heading "12. Contact us" [level=2] [ref=f3e139]
          - paragraph [ref=f3e140]:
            - text: "Privacy questions and rights requests:"
            - link "sales@valentisys.com" [ref=f3e141] [cursor=pointer]:
              - /url: mailto:sales@valentisys.com
            - text: "Recruitment and resume questions:"
            - link "careers@valentisys.com" [ref=f3e142] [cursor=pointer]:
              - /url: mailto:careers@valentisys.com
          - paragraph [ref=f3e143]: Valentisys
