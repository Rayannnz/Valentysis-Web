          - paragraph [ref=e60]: Before you write
          - heading "Questions we get asked first" [level=2] [ref=e61]
        - paragraph [ref=e62]: The answers we would give you on a first call, written down so you can decide whether it is worth having one.
      - generic [ref=e63]:
        - article [ref=e64]:
          - heading "How quickly can you have someone working?" [level=3] [ref=e65]
          - paragraph [ref=e66]: For roles we staff regularly — front desk, paralegal support, bookkeeping, customer support — a shortlist usually reaches you within a week, and a trained person is on live work inside two to three weeks. Specialist or unusual briefs take longer, and we will say so at the scoping call rather than after you have signed.
        - article [ref=e67]:
          - heading "How is the work priced?" [level=3] [ref=e68]
          - paragraph [ref=e69]: Scope, hours, and cost are agreed in writing before anyone starts, so the first invoice holds no surprises. Ongoing staffing is priced monthly per person or per agreed capacity; project work such as an app or a website is quoted as a fixed price against a defined scope.
        - article [ref=e70]:
          - heading "Do we have to sign a long contract?" [level=3] [ref=e71]
          - paragraph [ref=e72]: No. There is no minimum term and no lock-in. You can scale down or stop with clear notice. We would rather keep the account by doing the work well than by holding you to a contract you have outgrown.
        - article [ref=e73]:
          - heading "Where is your team based, and which hours do you cover?" [level=3] [ref=e74]
          - paragraph [ref=e75]: Our office is in Lahore, Pakistan, and our teams are scheduled around your time zone and your customers' hours rather than ours. Cover for UK, European, US, and Gulf business hours is routine; tell us the window you need and we will confirm it in the scope.
        - article [ref=e76]:
          - heading "How do you protect our data and our clients' records?" [level=3] [ref=e77]
          - paragraph [ref=e78]: "Everyone signs an NDA before starting. Access is least-privilege: people are given only the systems their role requires, and access is revoked when they roll off. We are used to the handling standards that legal, medical, and financial records carry, and we will work inside your systems and policies rather than copying data into ours."
        - article [ref=e79]:
          - heading "Can we meet the people before they start?" [level=3] [ref=e80]
          - paragraph [ref=e81]: Yes, and we prefer it. We shortlist against your brief and you meet and approve candidates before anyone touches live work. You are not handed an anonymous pool of seats.
