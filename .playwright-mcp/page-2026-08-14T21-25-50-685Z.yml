          - paragraph [ref=e76]: Use the controls at the bottom of this page to change your preferences or withdraw consent entirely. Withdrawing is exactly as easy as giving it, and takes effect immediately.
          - paragraph [ref=e77]: You can also clear site data through your browser settings, in Chrome, Firefox, Safari, and Edge alike. Doing so removes the record of your choice, so the banner will appear again on your next visit.
